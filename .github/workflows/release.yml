name: Release Linux amd64
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Download separate check library for tests
        run: git clone --depth 1 https://github.com/krolchonok/wscan-templates.git library
      - name: Vet
        run: CGO_ENABLED=0 go vet ./...
      - name: Test
        id: tests
        run: CGO_ENABLED=0 go test ./...
      - name: Package
        run: ./scripts/package-linux-amd64.sh "$GITHUB_REF_NAME"
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          printf 'Linux x86-64. Full test suite: %s. See docs/KNOWN_TEST_FAILURES.md for baseline limitations.\n' '${{ steps.tests.outcome }}' > "$RUNNER_TEMP/release-notes.md"
          gh release create "$GITHUB_REF_NAME" dist/wscan-*.tar.gz dist/wscan-*.sha256 --verify-tag --prerelease --notes-file "$RUNNER_TEMP/release-notes.md"
