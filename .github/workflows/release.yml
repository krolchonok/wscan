name: Build Linux and Windows
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux-amd64
          - os: windows-latest
            platform: windows-amd64
    runs-on: ${{ matrix.os }}
    env:
      CGO_ENABLED: '0'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Download separate check library for tests
        run: git clone --depth 1 https://github.com/krolchonok/wscan-templates.git library
      - name: Vet
        run: go vet ./...
      - name: Native tests
        run: go test ./...
      - name: Package Linux
        if: runner.os == 'Linux'
        shell: bash
        run: |
          version=dev
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then version="$GITHUB_REF_NAME"; fi
          ./scripts/package-linux-amd64.sh "$version"
      - name: Package and smoke test Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $version = 'dev'
          if ($env:GITHUB_REF -like 'refs/tags/*') { $version = $env:GITHUB_REF_NAME }
          python scripts/package-windows-amd64.py $version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Expand-Archive "dist/wscan-$version-windows-amd64.zip" -DestinationPath "$env:RUNNER_TEMP/wscan-smoke"
          $exe = "$env:RUNNER_TEMP/wscan-smoke/wscan-windows-amd64/wscan.exe"
          & $exe version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $exe capabilities
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        with:
          name: wscan-${{ matrix.platform }}
          path: dist/*
          if-no-files-found: error
  publish:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: wscan-*
          path: dist
          merge-multiple: true
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          printf 'Linux and Windows x86-64. Native go vet and go test passed on both CI runners. See WINDOWS.md in the Windows archive for platform limitations.\n' > "$RUNNER_TEMP/release-notes.md"
          gh release create "$GITHUB_REF_NAME" dist/* --verify-tag --prerelease --notes-file "$RUNNER_TEMP/release-notes.md"
